<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="2048" height="2048" role="img" aria-label="Enfant patient" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Patient – enfant (8–12 ans)</title>
  <defs>
    <linearGradient id="skinV" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#EFC49E"/><stop offset="1" stop-color="#E3AB82"/>
    </linearGradient>
    <radialGradient id="face" cx="0.5" cy="0.42" r="0.65">
      <stop offset="0" stop-color="#F1C8A4"/><stop offset="1" stop-color="#E2A97F"/>
    </radialGradient>
    <linearGradient id="shirt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3AA89D"/><stop offset="1" stop-color="#2B8E85"/>
    </linearGradient>
    <linearGradient id="hair" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#312A3A"/><stop offset="1" stop-color="#1F1A26"/>
    </linearGradient>
    <clipPath id="clipHead">
      <path d="M512,195 C620,195 690,275 690,395 C690,505 618,605 512,605 C406,605 334,505 334,395 C334,275 404,195 512,195 Z"/>
    </clipPath>
    <clipPath id="clipNeck">
      <path d="M452,560 V650 C452,670 432,680 392,680 L392,770 H632 V680 C592,680 572,670 572,650 V560 Z"/>
    </clipPath>
  </defs>

  <!-- BODY : hoodie -->
  <g id="patient-body">
    <ellipse id="hood-back" cx="512" cy="690" rx="178" ry="60" fill="#23847B"/>
    <g id="neck">
      <path d="M452,560 V650 C452,670 432,680 392,680 L392,770 H632 V680 C592,680 572,670 572,650 V560 Z" fill="url(#skinV)"/>
      <ellipse cx="512" cy="612" rx="125" ry="46" fill="#C98A62" opacity="0.35" clip-path="url(#clipNeck)"/>
    </g>
    <g id="torso">
      <path d="M150,900 V840 C150,764 214,724 304,702 L392,680 C428,746 596,746 632,680 L720,702 C810,724 874,764 874,840 V900 Z" fill="url(#shirt)"/>
      <path d="M318,708 C292,770 280,830 278,900" fill="none" stroke="#1F7A72" stroke-width="5" stroke-linecap="round" opacity="0.3"/>
      <path d="M706,708 C732,770 744,830 746,900" fill="none" stroke="#1F7A72" stroke-width="5" stroke-linecap="round" opacity="0.3"/>
      <path id="hood-rim" d="M392,680 C428,746 596,746 632,680" fill="none" stroke="#23847B" stroke-width="24" stroke-linecap="round"/>
      <path d="M402,684 C436,740 588,740 622,684" fill="none" stroke="#4DB7AB" stroke-width="4" stroke-linecap="round" opacity="0.6"/>
      <g id="drawstrings" fill="none" stroke-linecap="round">
        <path d="M470,732 C468,764 472,790 470,806" stroke="#E8F5F2" stroke-width="6"/>
        <path d="M554,732 C556,764 552,790 554,806" stroke="#E8F5F2" stroke-width="6"/>
        <path d="M470,806 V822" stroke="#BFDCD6" stroke-width="11"/>
        <path d="M554,806 V822" stroke="#BFDCD6" stroke-width="11"/>
      </g>
    </g>
  </g>
  <!-- HEAD -->
  <g id="patient-head">
    <g id="ears">
      <circle id="ear-left" cx="330" cy="415" r="34" fill="#E6B088" stroke="#D29A73" stroke-width="4"/>
      <ellipse cx="332" cy="417" rx="14" ry="20" fill="#D9A07A"/>
      <circle id="ear-right" cx="694" cy="415" r="34" fill="#E6B088" stroke="#D29A73" stroke-width="4"/>
      <ellipse cx="692" cy="417" rx="14" ry="20" fill="#D9A07A"/>
    </g>

    <path id="face" d="M512,195 C620,195 690,275 690,395 C690,505 618,605 512,605 C406,605 334,505 334,395 C334,275 404,195 512,195 Z" fill="url(#face)" stroke="#D29A73" stroke-width="4"/>

    <!-- soft shadow under the fringe -->
    <g clip-path="url(#clipHead)">
      <path transform="translate(0,16)" d="M330,402 C308,290 372,164 512,162 C652,164 716,290 694,402 C684,356 668,318 646,292 C608,306 550,290 510,262 C482,296 422,312 376,300 C350,332 340,368 330,402 Z" fill="#C98A62" opacity="0.22"/>
    </g>

    <g id="cheeks" fill="#F59E0B" opacity="0.14">
      <ellipse cx="412" cy="494" rx="34" ry="20"/>
      <ellipse cx="612" cy="494" rx="34" ry="20"/>
    </g>

    <g id="eyebrows" fill="none" stroke="#2A2431" stroke-width="10" stroke-linecap="round">
      <path id="brow-left" d="M402,368 Q438,346 478,362"/>
      <path id="brow-right" d="M546,362 Q586,346 622,368"/>
    </g>

    <g id="eyes">
      <g id="eye-left">
        <ellipse cx="440" cy="418" rx="29" ry="25" fill="#FFFFFF"/>
        <circle cx="440" cy="421" r="17" fill="#4A3329"/>
        <circle cx="440" cy="421" r="8.5" fill="#1A1418"/>
        <circle cx="446" cy="414" r="5" fill="#FFFFFF"/>
        <path d="M410,414 Q440,386 470,414" fill="none" stroke="#2A2431" stroke-width="6" stroke-linecap="round"/>
      </g>
      <g id="eye-right">
        <ellipse cx="584" cy="418" rx="29" ry="25" fill="#FFFFFF"/>
        <circle cx="584" cy="421" r="17" fill="#4A3329"/>
        <circle cx="584" cy="421" r="8.5" fill="#1A1418"/>
        <circle cx="590" cy="414" r="5" fill="#FFFFFF"/>
        <path d="M554,414 Q584,386 614,414" fill="none" stroke="#2A2431" stroke-width="6" stroke-linecap="round"/>
      </g>
    </g>

    <g id="nose">
      <ellipse cx="512" cy="470" rx="8" ry="12" fill="#FFFFFF" opacity="0.12"/>
      <path d="M498,484 C504,494 520,494 526,484" fill="none" stroke="#C98A62" stroke-width="5" stroke-linecap="round"/>
    </g>

    <g id="mouth" fill="none" stroke-linecap="round">
      <path d="M482,540 Q512,552 542,540" stroke="#B4614C" stroke-width="7"/>
      <path d="M498,558 Q512,564 526,558" stroke="#D48A73" stroke-width="4" opacity="0.6"/>
    </g>

    <g id="hair">
      <path d="M330,402 C308,290 372,164 512,162 C652,164 716,290 694,402 C684,356 668,318 646,292 C608,306 550,290 510,262 C482,296 422,312 376,300 C350,332 340,368 330,402 Z" fill="url(#hair)"/>
      <path d="M396,218 C450,186 566,182 628,218" fill="none" stroke="#4A4056" stroke-width="10" stroke-linecap="round" opacity="0.6"/>
      <path d="M510,262 C524,236 560,216 602,212" fill="none" stroke="#3F3648" stroke-width="5" stroke-linecap="round" opacity="0.5"/>
    </g>
  </g>
</svg>
