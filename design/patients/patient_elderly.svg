<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="2048" height="2048" role="img" aria-label="Patient âgé" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Patient – personne âgée (65–80 ans)</title>
  <defs>
    <linearGradient id="skinV" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E9C2A0"/><stop offset="1" stop-color="#DCAA84"/>
