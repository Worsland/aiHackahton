    <g id="mouth" fill="none" stroke-linecap="round">
      <path d="M486,554 Q512,562 538,554" stroke="#B4614C" stroke-width="7"/>
      <path d="M498,570 Q512,576 526,570" stroke="#D48A73" stroke-width="4" opacity="0.6"/>
    </g>

    <g id="hair">
      <path d="M330,410 C312,290 372,172 512,170 C652,172 712,290 694,410 C690,380 684,352 666,326 C658,312 654,300 650,292 C612,300 566,286 512,278 C458,286 412,300 374,292 C370,300 366,312 358,326 C340,352 334,380 330,410 Z" fill="url(#hair)"/>
      <path d="M398,224 C450,198 574,198 626,224" fill="none" stroke="#4A4056" stroke-width="10" stroke-linecap="round" opacity="0.6"/>
    </g>
  </g>
</svg>
