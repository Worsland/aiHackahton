    <g id="eyebrows" fill="none" stroke="#2A2431" stroke-width="11" stroke-linecap="round">
      <path id="brow-left" d="M398,368 Q438,350 482,362"/>
      <path id="brow-right" d="M542,362 Q586,350 626,368"/>
    </g>

    <g id="eyes">
      <g id="eye-left">
        <ellipse cx="440" cy="410" rx="28" ry="20" fill="#FFFFFF"/>
        <circle cx="440" cy="413" r="15" fill="#4A3329"/>
        <circle cx="440" cy="413" r="7.5" fill="#1A1418"/>
        <circle cx="445" cy="407" r="4.5" fill="#FFFFFF"/>
        <path d="M411,406 Q440,382 469,406" fill="none" stroke="#2A2431" stroke-width="6" stroke-linecap="round"/>
      </g>
      <g id="eye-right">
        <ellipse cx="584" cy="410" rx="28" ry="20" fill="#FFFFFF"/>
        <circle cx="584" cy="413" r="15" fill="#4A3329"/>
        <circle cx="584" cy="413" r="7.5" fill="#1A1418"/>
        <circle cx="589" cy="407" r="4.5" fill="#FFFFFF"/>
        <path d="M555,406 Q584,382 613,406" fill="none" stroke="#2A2431" stroke-width="6" stroke-linecap="round"/>
      </g>
    </g>

    <g id="nose">
