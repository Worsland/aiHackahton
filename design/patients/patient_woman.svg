      <path transform="translate(0,14)" d="M512,248 C450,260 396,298 376,340 C368,364 364,396 362,430 C360,500 380,560 392,620 C400,670 410,710 410,750 C412,782 396,808 366,808 C334,808 316,782 318,730 C322,640 322,520 326,400 C328,262 400,178 512,178 C624,178 696,262 698,400 C702,520 702,640 706,730 C708,782 690,808 658,808 C628,808 612,782 614,750 C614,710 624,670 632,620 C644,560 664,500 662,430 C660,398 656,364 648,340 C628,298 574,260 512,248 Z" fill="#C98A62" opacity="0.2"/>
