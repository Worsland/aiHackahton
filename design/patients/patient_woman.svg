      <path d="M318,708 C292,770 280,830 278,900" fill="none" stroke="#A5661C" stroke-width="5" stroke-linecap="round" opacity="0.3"/>
      <path d="M706,708 C732,770 744,830 746,900" fill="none" stroke="#A5661C" stroke-width="5" stroke-linecap="round" opacity="0.3"/>
      <g id="turtleneck">
        <path d="M418,686 L428,632 Q430,608 456,608 H568 Q594,608 596,632 L606,686 Z" fill="#E2A249"/>
        <path d="M442,619 H582" fill="none" stroke="#F0BE6E" stroke-width="6" stroke-linecap="round" opacity="0.7"/>
        <path d="M430,640 Q512,654 594,640" fill="none" stroke="#A5661C" stroke-width="5" stroke-linecap="round" opacity="0.3"/>
        <path d="M424,663 Q512,677 600,663" fill="none" stroke="#A5661C" stroke-width="5" stroke-linecap="round" opacity="0.3"/>
        <path d="M418,686 H606" fill="none" stroke="#A5661C" stroke-width="5" stroke-linecap="round" opacity="0.35"/>
      </g>
    </g>
