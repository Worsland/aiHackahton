<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="2048" height="2048" role="img" aria-label="Patiente jeune adulte" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Patiente – jeune femme (20–30 ans)</title>
  <defs>
    <linearGradient id="skinV" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#EDC09A"/><stop offset="1" stop-color="#E0A67C"/>
    </linearGradient>
    <radialGradient id="face" cx="0.5" cy="0.42" r="0.65">
      <stop offset="0" stop-color="#F1C7A3"/><stop offset="1" stop-color="#E1A87E"/>
