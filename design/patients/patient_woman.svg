      <path d="M392,232 C450,198 574,198 632,232" fill="none" stroke="#4A4056" stroke-width="10" stroke-linecap="round" opacity="0.6"/>
      <path d="M346,470 C342,560 346,650 350,740" fill="none" stroke="#4A4056" stroke-width="8" stroke-linecap="round" opacity="0.35"/>
      <path d="M678,470 C682,560 678,650 674,740" fill="none" stroke="#4A4056" stroke-width="8" stroke-linecap="round" opacity="0.35"/>
    </g>
  </g>
</svg>
