      <path d="M497,490 C504,501 520,501 527,490" fill="none" stroke="#C98A62" stroke-width="5" stroke-linecap="round"/>
    </g>

    <g id="mouth">
      <path d="M492,554 Q512,576 532,554 Q512,560 492,554 Z" fill="#DE8F7D" opacity="0.55"/>
      <path d="M484,552 Q512,562 540,552" fill="none" stroke="#B4614C" stroke-width="7" stroke-linecap="round"/>
