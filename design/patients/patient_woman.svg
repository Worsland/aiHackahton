    <clipPath id="clipHead">
      <path d="M512,200 C616,200 682,280 682,392 C682,496 606,618 512,618 C418,618 342,496 342,392 C342,280 408,200 512,200 Z"/>
    </clipPath>
    <clipPath id="clipNeck">
      <path d="M454,570 V650 C454,670 432,678 392,678 L392,760 H632 V678 C592,678 570,670 570,650 V570 Z"/>
    </clipPath>
  </defs>

  <!-- HAIR (back layer) -->
  <path id="hair-back" d="M512,170 C400,170 320,250 318,384 C316,520 312,640 318,730 L706,730 C712,640 708,520 706,384 C704,250 624,170 512,170 Z" fill="#1F1A26"/>

  <!-- BODY : turtleneck -->
  <g id="patient-body">
