        <circle cx="442" cy="413" r="15" fill="#4A3329"/>
        <circle cx="442" cy="413" r="7.5" fill="#1A1418"/>
        <circle cx="447" cy="407" r="4.5" fill="#FFFFFF"/>
        <path d="M414,405 Q442,381 470,405" fill="none" stroke="#2A2431" stroke-width="6" stroke-linecap="round"/>
        <path d="M414,405 Q409,405 405,411" fill="none" stroke="#2A2431" stroke-width="5" stroke-linecap="round"/>
      </g>
      <g id="eye-right">
