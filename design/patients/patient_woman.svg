    <linearGradient id="top" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E4A54B"/><stop offset="1" stop-color="#CB8828"/>
    </linearGradient>
    <linearGradient id="hair" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#312A3A"/><stop offset="1" stop-color="#1F1A26"/>
