        <circle cx="582" cy="413" r="15" fill="#4A3329"/>
        <circle cx="582" cy="413" r="7.5" fill="#1A1418"/>
        <circle cx="587" cy="407" r="4.5" fill="#FFFFFF"/>
        <path d="M554,405 Q582,381 610,405" fill="none" stroke="#2A2431" stroke-width="6" stroke-linecap="round"/>
        <path d="M610,405 Q615,405 619,411" fill="none" stroke="#2A2431" stroke-width="5" stroke-linecap="round"/>
      </g>
    </g>

    <g id="nose">
